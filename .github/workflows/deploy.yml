name: Deploy to GitHub Pages
run-name: Deploy to GitHub Pages ${{ inputs.spotlight_event_id }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spotlight_event_id:
        description: Publication event receipt, when triggered by a spotlight release
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit commercial terms
        run: npm run terms:audit
      - name: Lint
        run: npm run lint
      - name: Test video upload handling
        run: npm run test:video
      - name: Test instructor approval flow
        run: npm run test:approval
      - name: Test authentication routing
        run: npm run test:auth
      - name: Test instructor and organizer journeys
        run: npm run test:journeys
      - name: Test admin navigation and review queue
        run: node --test scripts/test-admin-navigation.mjs
      - name: Test admin inquiry visibility
        run: node --test scripts/test-admin-inquiries.mjs
      - name: Test instructor pricing guidance
        run: npm run test:pricing-guidance
      - name: Test booking agreement PDFs
        run: npm run test:booking-document
      - name: Test IndexNow sitemap comparison
        run: npm run test:indexnow
      - name: Test published profile export
        run: npm run test:profile-sync
      - name: Test spotlight publication and recovery
        run: node --test scripts/test-spotlight-publication.mjs && node scripts/test-spotlight-events-sql.mjs
      - name: Build static export
        run: npm run build
        env:
          # These are browser-safe Supabase credentials. Row Level Security
          # remains the authorization boundary for all marketplace data.
          NEXT_PUBLIC_SUPABASE_URL: https://wzmyroeowbsxxibkeejf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_36gNqu74ysQhY2_VvJlS4A_XTYUFyxe
      - name: Audit generated site
        run: npm run audit:static
      - name: Verify searchable instructor profiles
        run: npm run test:profile-search
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture the current sitemap for IndexNow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --capture
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about newly published pages
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
